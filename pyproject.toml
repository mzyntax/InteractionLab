[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "model-battlegrounds"
version = "0.1.0"
description = "A modular AI debate experimentation platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
model-battlegrounds = "model_battlegrounds.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/model_battlegrounds"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
